# Local PostgreSQL, if you want to develop against the same database as production:
#   docker compose up -d
#   DATABASE_URL=postgresql://registry:registry@localhost:5432/registry npm run dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U registry"], interval: 5s, timeout: 3s, retries: 10 }
volumes: { postgres_data: {} }
