# Local development only. Credentials here are not for any deployed environment.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U registry"], interval: 5s, timeout: 3s, retries: 10 }
  # S3-compatible private bucket for evidence files (SeaweedFS). Run `npm run storage:init` once.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["s3_data:/data", "./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"]
volumes: { postgres_data: {}, s3_data: {} }
